<!doctype html>
<html lang="it">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Terra / Mare</title>
  <main>
    <aside>
      <header>Underwater World Model · v0.33</header>
      <h1>Terra / Mare</h1>
      <nav>
        <button id="terra">Terra</button
        ><button id="mare" class="selected">Mare</button>
      </nav>
      <section id="marine">
        <h2>Batimetria</h2>
        <label
          >Superficie
          <select id="source">
            <option value="auto">Miglior dettaglio disponibile</option>
          </select></label
        >
        <label
          ><input type="checkbox" id="surface" checked /> Mostra fondale</label
        ><label
          >Numero di isobate
          <input id="count" type="number" min="0" max="40" value="6"
        /></label>
        <p id="range"></p>
        <p id="levels"></p>
        <h2>Area di interesse</h2>
        <div>
          <button id="draw">Seleziona AOI</button>
          <button id="clear">Rimuovi</button>
        </div>
        <p id="extent"></p>
        <h2>Cartografia nautica</h2>
        <div id="layers"></div>
        <label
          >Raggio per punti e linee (m)
          <input id="radius" type="number" min="0" max="10000" value="0"
        /></label>
        <p id="chartState">Nessuna cella ENC caricata.</p>
        <details>
          <summary>Dati e importazione</summary>
          <p>
            <a href="https://emodnet.ec.europa.eu/geoviewer/" target="_blank"
              >Catalogo rilievi locali EMODnet</a
            >
          </p>
          <button id="download">Scarica griglie dell’area</button>
          <p id="network"></p>
          <label
            >Fonte del rilievo
            <input id="survey" placeholder="Nome del rilievo" /></label
          ><label
            >Datum verticale del file
            <select id="datum">
              <option>Sconosciuto</option>
              <option>LAT</option>
              <option>MSL</option>
            </select></label
          ><label
            >Convenzione
            <select id="sign">
              <option value="down">Profondità positive</option>
              <option value="up">Quote positive in alto</option>
            </select></label
          >
          <label>Data rilievo <input id="surveyDate" type="date" /></label
          ><label
            >Incertezza (m, facoltativa)
            <input id="sigma" type="number" min="0" step="any"
          /></label>
          <label
            >GeoTIFF WGS84 o ENC convertita (.geojson)
            <input id="upload" type="file" accept=".tif,.tiff,.geojson,.json"
          /></label>
          <p id="importState"></p>
        </details>
      </section>
      <p id="landInfo" hidden>Carta terrestre · OpenStreetMap</p>
      <p><a href="./console.html">Console v0.32</a></p>
    </aside>
    <article>
      <div id="map"></div>
      <div id="inspect" role="status">
        Seleziona un punto per leggere i dati.
      </div>
    </article>
  </main>
  <script type="module" src="/src/atlas/app.js"></script>
</html>
